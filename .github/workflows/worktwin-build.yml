name: WorkTwin tests and native smoke builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worktwin-collector/**'
      - '.github/workflows/worktwin-build.yml'

concurrency:
  group: worktwin-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: worktwin-collector

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/acceptance_benchmark.py
      - run: PYTHONPATH=. python scripts/http_acceptance.py

  macos:
    needs: python-test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: zsh desktop/build-macos.sh
      - name: Verify packaged application starts and serves the local UI
        run: python scripts/smoke_desktop.py dist/WorkTwin.app/Contents/MacOS/WorkTwin
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-macOS-unsigned
          path: worktwin-collector/release/*.dmg
          if-no-files-found: error

  windows:
    needs: python-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./desktop/build-windows.ps1
      - name: Verify packaged application starts and serves the local UI
        run: python scripts/smoke_desktop.py dist/WorkTwin/WorkTwin.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-Windows-unsigned
          path: worktwin-collector/dist/WorkTwin/
          if-no-files-found: error
