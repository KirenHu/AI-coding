name: WorkTwin 1.3.1 acceptance and signed release

on:
  workflow_dispatch:
    inputs:
      macos_architecture:
        description: macOS architecture to validate (main releases always build both)
        type: choice
        default: all
        options: [all, arm64, x86_64]
      signed_release:
        description: 'Explicitly sign, notarize and publish a formal release (main and both architectures only)'
        type: boolean
        default: false
  pull_request:
    paths: ['worktwin-collector/**', '.github/workflows/worktwin-build.yml']
  push:
    branches: [main]
    paths: ['worktwin-collector/**', '.github/workflows/worktwin-build.yml']

concurrency:
  group: worktwin-${{ github.event_name == 'workflow_dispatch' && inputs.signed_release && 'signed-release' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signed_release) }}
permissions:
  contents: read
defaults:
  run:
    working-directory: worktwin-collector
jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]' build playwright
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/evaluate_twin.py
      - run: PYTHONPATH=. python scripts/acceptance_benchmark.py
      - run: PYTHONPATH=. python scripts/http_acceptance.py
      - run: node --check worktwin/static/app.js
      - name: Validate browser extension JavaScript
        run: |
          node --check worktwin/browser_extension/service-worker.js
          node --check worktwin/browser_extension/content.js
          node --check worktwin/browser_extension/popup.js
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance of collection, editing and authorization
        run: PYTHONPATH=. python scripts/ui_acceptance.py
      - name: Browser acceptance of explicit refresh and assistant source detection
        run: PYTHONPATH=. python scripts/ui_refresh_acceptance.py
      - name: Browser acceptance of knowledge updates
        run: PYTHONPATH=. python scripts/ui_proposals_acceptance.py
      - name: Browser acceptance of remote sharing and owner offline use
        run: PYTHONPATH=. python scripts/ui_sharing_acceptance.py
      - name: Browser acceptance of personal and enterprise settings
        run: PYTHONPATH=. python scripts/ui_settings_acceptance.py
      - name: Settings remain reachable with long lists and short windows
        env:
          WORKTWIN_UI_LAYOUT_SCREENSHOT: release/WorkTwin-layout.png
        run: PYTHONPATH=. python scripts/ui_layout_acceptance.py
      - name: Browser acceptance of twin MCP and separate log authorization
        run: PYTHONPATH=. python scripts/ui_mcp_acceptance.py
      - name: Chromium MV3 acceptance of signed task capture and navigation stop
        run: PYTHONPATH=. python scripts/ui_browser_extension_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WorkTwin-browser-screenshots
          path: worktwin-collector/release/*.png
          if-no-files-found: ignore
      - name: Build source and standard Python distribution
        run: |
          python -m build
          mkdir -p release
          git -C .. archive HEAD:worktwin-collector --format=zip -o "$PWD/release/WorkTwin-Collector-1.3.1-source.zip"
          python -c 'from zipfile import ZipFile; z=ZipFile("release/WorkTwin-Collector-1.3.1-source.zip"); assert all(p in z.namelist() for p in ("README.md", "pyproject.toml", "worktwin/api.py", "third_party/rowboat/LICENSE")), "Incomplete source archive"'
          cp dist/*.whl dist/*.tar.gz release/
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-source-and-wheel
          path: worktwin-collector/release/*
          if-no-files-found: error
  macos:
    needs: python-test
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.macos_architecture == 'arm64' && '["macos-15"]') || (github.event_name == 'workflow_dispatch' && inputs.macos_architecture == 'x86_64' && '["macos-15-intel"]') || '["macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      WORKTWIN_REQUIRE_NOTARIZATION: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signed_release && inputs.macos_architecture == 'all' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare temporary Developer ID signing keychain
        if: env.WORKTWIN_REQUIRE_NOTARIZATION == '1'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python desktop/prepare-macos-signing.py
      - name: Build, sign and notarize App and DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: zsh desktop/build-macos.sh
      - name: Mount verified DMG and Gatekeeper-test the installed app
        run: zsh desktop/verify-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-${{ matrix.runner }}-${{ env.WORKTWIN_REQUIRE_NOTARIZATION == '1' && 'notarized' || 'unsigned' }}
          path: worktwin-collector/release/*.dmg
          if-no-files-found: error
      - name: Preserve signed artifacts for resuming an incomplete Apple review
        if: failure() && env.WORKTWIN_REQUIRE_NOTARIZATION == '1'
        uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-${{ matrix.runner }}-pending-notarization
          path: |
            worktwin-collector/dist/WorkTwin-notary.zip
            worktwin-collector/dist/*.notary.json
            worktwin-collector/release/*.dmg
            worktwin-collector/release/*.notary.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Delete temporary developer signing credentials
        if: always() && env.WORKTWIN_REQUIRE_NOTARIZATION == '1'
        run: python desktop/cleanup-macos-signing.py
  windows:
    needs: python-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./desktop/build-windows.ps1
      - name: Verify the packaged application starts
        run: python scripts/smoke_desktop.py dist/WorkTwin/WorkTwin.exe
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path dist/WorkTwin -DestinationPath release/WorkTwin-Collector-1.3.1-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-Windows-unsigned
          path: worktwin-collector/release/*.zip
          if-no-files-found: error
  release:
    needs: [python-test, macos, windows]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signed_release && inputs.macos_architecture == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums and publish the trusted 1.3.1 release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          test -f WorkTwin-Collector-1.3.1-macOS-arm64.dmg
          test -f WorkTwin-Collector-1.3.1-macOS-x86_64.dmg
          if find . -name '*-unsigned.dmg' | grep -q .; then
            echo 'Refusing to publish unsigned DMGs' >&2
            exit 1
          fi
          sha256sum *.zip *.dmg *.whl *.tar.gz > SHA256SUMS.txt
          cd ..
          if gh release view worktwin-v1.3.1 >/dev/null 2>&1; then
            echo 'The existing v1.3.1 release is immutable; a new release needs a new version'
            exit 0
          fi
          gh release create worktwin-v1.3.1 --target "$GITHUB_SHA" --title "WorkTwin Collector 1.3.1 (autonomous knowledge, task capture and trusted macOS delivery)" --notes-file worktwin-collector/RELEASE_NOTES.md release-assets/*
