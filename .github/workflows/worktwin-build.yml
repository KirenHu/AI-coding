name: WorkTwin 1.1.8 acceptance and release

on:
  workflow_dispatch:
  pull_request:
    paths: ['worktwin-collector/**', '.github/workflows/worktwin-build.yml']
  push:
    branches: [main]
    paths: ['worktwin-collector/**', '.github/workflows/worktwin-build.yml']

concurrency:
  group: worktwin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: worktwin-collector
jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]' build playwright
      - run: python -m pytest -q
      - run: PYTHONPATH=. python scripts/evaluate_twin.py
      - run: PYTHONPATH=. python scripts/acceptance_benchmark.py
      - run: PYTHONPATH=. python scripts/http_acceptance.py
      - run: node --check worktwin/static/app.js
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance of collection, editing and authorization
        run: PYTHONPATH=. python scripts/ui_acceptance.py
      - name: Browser acceptance of knowledge updates
        run: PYTHONPATH=. python scripts/ui_proposals_acceptance.py
      - name: Browser acceptance of remote sharing and owner offline use
        run: PYTHONPATH=. python scripts/ui_sharing_acceptance.py
      - name: Browser acceptance of personal and enterprise settings
        run: PYTHONPATH=. python scripts/ui_settings_acceptance.py
      - name: Settings remain reachable with long lists and short windows
        env:
          WORKTWIN_UI_LAYOUT_SCREENSHOT: release/WorkTwin-layout.png
        run: PYTHONPATH=. python scripts/ui_layout_acceptance.py
      - name: Browser acceptance of twin MCP and separate log authorization
        run: PYTHONPATH=. python scripts/ui_mcp_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WorkTwin-browser-screenshots
          path: worktwin-collector/release/*.png
          if-no-files-found: ignore
      - name: Build source and standard Python distribution
        run: |
          python -m build
          mkdir -p release
          git -C .. archive HEAD:worktwin-collector --format=zip -o "$PWD/release/WorkTwin-Collector-1.1.8-source.zip"
          python -c 'from zipfile import ZipFile; z=ZipFile("release/WorkTwin-Collector-1.1.8-source.zip"); assert all(p in z.namelist() for p in ("README.md", "pyproject.toml", "worktwin/api.py", "third_party/rowboat/LICENSE")), "Incomplete source archive"'
          cp dist/*.whl dist/*.tar.gz release/
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-source-and-wheel
          path: worktwin-collector/release/*
          if-no-files-found: error
  macos:
    needs: python-test
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: zsh desktop/build-macos.sh
      - name: Mount the release DMG and verify its code seal, installed layout, and native startup
        run: zsh desktop/verify-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-${{ matrix.runner }}-unsigned
          path: worktwin-collector/release/*.dmg
          if-no-files-found: error
  windows:
    needs: python-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./desktop/build-windows.ps1
      - name: Verify the packaged application starts
        run: python scripts/smoke_desktop.py dist/WorkTwin/WorkTwin.exe
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path dist/WorkTwin -DestinationPath release/WorkTwin-Collector-1.1.8-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTwin-Windows-unsigned
          path: worktwin-collector/release/*.zip
          if-no-files-found: error
  release:
    needs: [python-test, macos, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums and publish the verified 1.1 release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.zip *.dmg *.whl *.tar.gz > SHA256SUMS.txt
          cd ..
          if gh release view worktwin-v1.1.8 >/dev/null 2>&1; then
            gh release upload worktwin-v1.1.8 release-assets/* --clobber
          else
            gh release create worktwin-v1.1.8 --target "$GITHUB_SHA" --title "WorkTwin Collector 1.1.8 (autonomous knowledge upkeep)" --notes-file worktwin-collector/RELEASE_NOTES.md release-assets/*
          fi
