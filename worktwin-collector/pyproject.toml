[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worktwin-collector"
version = "1.0.0"
description = "Local-first work memory collector with grounded, editable knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "WorkTwin Contributors"}]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
  "watchfiles>=0.24,<2",
  "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
package = ["pyinstaller>=6"]

[project.scripts]
worktwin = "worktwin.__main__:main"

[tool.setuptools.package-data]
worktwin = ["static/*"]

[tool.setuptools.data-files]
"share/worktwin/third_party/rowboat" = ["third_party/rowboat/LICENSE", "third_party/rowboat/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.setuptools.packages.find]
include = ["worktwin*"]
exclude = ["tests*", "desktop*", "scripts*"]
