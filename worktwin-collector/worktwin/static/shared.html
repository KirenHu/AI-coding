<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkTwin · 数字分身</title>
<style>body{margin:0;background:#f8f9fb;color:#253044;font:15px/1.7 system-ui}main{max-width:720px;margin:8vh auto;padding:28px}small{color:#778399}h1{font-size:30px}section{background:white;border:1px solid #e3e7ed;border-radius:14px;padding:24px;margin:22px 0}textarea{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #dce1e8;border-radius:8px;resize:vertical}button{border:0;background:#5264dc;color:white;padding:12px 22px;border-radius:8px;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}#answer{white-space:pre-wrap}details{color:#637087}a{color:#5264dc}.citation{display:inline-block;margin:6px 10px 0 0;background:transparent;color:#5264dc;padding:4px;text-align:left}</style>
<main><small>WORKTWIN · 受邀访问</small><h1 id="name">正在验证分享…</h1><p id="description"></p><section id="workspace" hidden><textarea id="question" rows="3" maxlength="500" placeholder="向这个数字分身提出工作问题…"></textarea><button id="ask">提问</button><div id="answer" aria-live="polite"></div><small id="citations"></small></section><section id="citation-detail" hidden></section><details><summary>可使用的知识</summary><ul id="knowledge"></ul></details><p><small id="expiry"></small></p><p><small>依据授权知识回答 · 此链接持有人可以访问，请勿转发</small></p></main>
<script>
const incoming=new URLSearchParams(location.hash.slice(1)).get('access')||'';
const storageKey='worktwin-share:'+location.pathname;
let token=incoming;
try{if(incoming)sessionStorage.setItem(storageKey,incoming);else token=sessionStorage.getItem(storageKey)||'';history.replaceState(null,'',location.pathname);}catch{} // Keep the fragment if tab storage is unavailable.
const node=id=>document.getElementById(id);
async function request(path,body){
  const r=await fetch('/v1/shared'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const data=await r.json();
  if(!r.ok){if(r.status===403){try{sessionStorage.removeItem(storageKey)}catch{}node('workspace').hidden=true;node('citation-detail').hidden=true;node('citation-detail').replaceChildren();node('knowledge').replaceChildren();node('citations').replaceChildren();node('name').textContent='分享已到期或已撤销';}throw Error(typeof data.detail==='string'?data.detail:'请求未完成');}return data
}
async function openKnowledge(id){try{const k=await request('/knowledge/'+id);const box=node('citation-detail');box.replaceChildren();const heading=document.createElement('h2');heading.textContent=k.title;const body=document.createElement('div');body.style.whiteSpace='pre-wrap';body.textContent=k.body;const close=document.createElement('button');close.textContent='关闭知识';close.onclick=()=>box.hidden=true;box.append(heading,body,close);box.hidden=false;}catch(e){node('answer').textContent=e.message}}
function citationButton(k){const b=document.createElement('button');b.className='citation';b.textContent='[K'+(k.knowledge_id||k.id)+'] '+k.title;b.onclick=()=>openKnowledge(k.knowledge_id||k.id);return b}
request('').then(d=>{node('name').textContent=d.name;node('description').textContent=d.description;node('workspace').hidden=false;node('expiry').textContent='访问有效期至 '+new Date(d.expires_at*1000).toLocaleString();d.knowledge.forEach(k=>{const li=document.createElement('li');li.append(citationButton(k));node('knowledge').append(li)})}).catch(e=>{node('name').textContent=e.message;node('description').textContent='请使用完整的原分享链接重新打开。网络异常时可刷新重试。'});
node('ask').onclick=async()=>{const question=node('question').value.trim();if(question.length<2)return;node('ask').disabled=true;node('answer').textContent='正在查找授权知识…';node('citations').replaceChildren();node('citation-detail').hidden=true;try{const r=await request('/ask',{question});node('answer').textContent=r.answer;r.citations.forEach(c=>node('citations').append(citationButton(c)))}catch(e){node('answer').textContent=e.message}finally{node('ask').disabled=false}};
node('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!node('ask').disabled)node('ask').click()}});
</script></html>
