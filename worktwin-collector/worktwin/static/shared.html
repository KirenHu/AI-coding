<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkTwin · 数字分身</title>
<style>body{margin:0;background:#f8f9fb;color:#253044;font:15px/1.7 system-ui}main{max-width:720px;margin:8vh auto;padding:28px}small{color:#778399}h1{font-size:30px}section{background:white;border:1px solid #e3e7ed;border-radius:14px;padding:24px;margin:22px 0}textarea{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:1px solid #dce1e8;border-radius:8px;resize:vertical}button{border:0;background:#5264dc;color:white;padding:12px 22px;border-radius:8px;margin-top:12px;cursor:pointer}button:disabled{opacity:.5}#answer{white-space:pre-wrap}details{color:#637087}a{color:#5264dc}</style>
<main><small>WORKTWIN · 受邀访问</small><h1 id="name">正在验证分享…</h1><p id="description"></p><section id="workspace" hidden><textarea id="question" rows="3" maxlength="500" placeholder="向这个数字分身提出工作问题…"></textarea><button id="ask">提问</button><div id="answer" aria-live="polite"></div><small id="citations"></small></section><details><summary>可使用的知识</summary><ul id="knowledge"></ul></details><p><small id="expiry"></small></p><p><small>依据授权知识回答 · 此链接持有人可以访问，请勿转发</small></p></main>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('access')||'';
history.replaceState(null,'',location.pathname);
const node=id=>document.getElementById(id);
async function request(path,body){const r=await fetch('/v1/shared'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'请求未完成');return data}
request('').then(d=>{node('name').textContent=d.name;node('description').textContent=d.description;node('workspace').hidden=false;node('expiry').textContent='访问有效期至 '+new Date(d.expires_at*1000).toLocaleString();d.knowledge.forEach(k=>{const li=document.createElement('li');li.textContent=k.title;node('knowledge').append(li)})}).catch(e=>node('name').textContent=e.message);
node('ask').onclick=async()=>{const question=node('question').value.trim();if(question.length<2)return;node('ask').disabled=true;node('answer').textContent='正在查找授权知识…';node('citations').textContent='';try{const r=await request('/ask',{question});node('answer').textContent=r.answer;node('citations').textContent=r.citations.map(c=>'[K'+c.knowledge_id+'] '+c.title).join(' · ')}catch(e){node('answer').textContent=e.message}finally{node('ask').disabled=false}};
</script></html>
